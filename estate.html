    else if (d.type) { S.type = d.type; renderCtl(); drawPins(); render(); }
    else if (d.contract) openContract(S.sel, d.contract);
    else if (d.close) { S.sheet = null; drawSheet(); }
    else if (d.sign) sign();
    else if (d.list) listUnit(d.list);
    else if (d.unlist) unlist(S.sel, d.unlist);
    else if (d.unlist2) { const h = homes()[d.unlist2]; if (h) unlist(h.pid, h.k); }
    else if (d.quick) quickSell(d.quick);
    else if (d.repay) repay(d.repay);
    else if (d.mode) { const [hid, m] = d.mode.split("|"); setMode(hid, m); }
    else if (d.rm) remodel(d.rm);
    else if (d.landtrade) tradeLand(d.landtrade);
    else if (d.landdrag) { landDragMode=!landDragMode; landShow(true); }
    else if (d.landclear) { landSelection=[]; S.land=null; landShow(true); render(); }
    else if (d.landme) landMe(d.landme);
    else if (d.sel) select(d.sel, true);
    else if (d.back) { S.sel = null; drawPins(); render(); }
    else if (d.sort) { S.sort = d.sort; render(); }
    else if (d.range) { S.range = +d.range; render(); }
    else if (d.dtab) { S.dtab = d.dtab; render(); }
    else if (d.rent) claimRent(); });
  document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value.trim(); if (!e.isComposing && !e.target.composing) { drawPins(); render(); } } else if (e.target.id === "ltv" && S.sheet) { S.sheet.ltv = +e.target.value; drawSheet(); const el = $("ltv"); if (el) el.focus(); } });
  document.addEventListener("compositionstart", e => { if (e.target.id === "q") e.target.composing = true; });
  document.addEventListener("compositionend", e => { if (e.target.id === "q") { e.target.composing = false; S.q = e.target.value.trim(); drawPins(); render(); } });
  $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") { S.sheet = null; drawSheet(); } });
  $("logout").addEventListener("click", () => window.WJ && WJ.logout());

  (async function boot() {
    initMap(); setupLandDrag(); render();
    while (!window.WJ) await new Promise(r => setTimeout(r, 40));
    await WJ.authReady; me = WJ.uid(); if (!me) { WJ.requireUser(); return; }
    db = await WJ.ready; WJ.presence(me).catch(() => {});
    let first = true;
    db.ref("users/" + me).on("value", s => { const u = s.val(); if (!u || u.banned) return WJ.logout(); S.user = u; $("cash").textContent = fmt(u.cash) + "준"; if (first) { first = false; migrate(); setTimeout(() => claimRent(true), 1500); } drawPins(); renderSoon(); if (S.sheet && !S.sheet.busy && !S.sheet.done) drawSheet(); });
    const loadUsers = () => db.ref("users").once("value").then(s => { S.users = s.val() || {}; drawPins(); if (S.tab === "mine" || S.sel) renderSoon(); }).catch(() => {}); loadUsers(); setInterval(loadUsers, 60000);
    db.ref("estate").on("value", s => { EST = s.val() || {}; drawPins(); renderSoon(); }, e => toast(/permission/i.test(String(e)) ? "Firebase 규칙에 estate 경로를 추가해야 해요" : "불러오지 못했어요", "⚠️"));
    setInterval(() => { drawPins(); const a = document.activeElement; if (!(a && a.id === "q") && !S.sheet) render(); }, 10000);
  })();
})();
</script>
</body>
